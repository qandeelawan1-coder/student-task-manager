<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Task Manager</title>
<style>
  :root {
    --bg: #e8eef7; --grid: #cbd7e8; --sheet: #ffffff; --ink: #14213d; --muted: #5a6a88;
    --accent: #1f3fbf; --accent-text: #ffffff; --line: #d9e1ef; --mark: #ffe14d; --mark-text: #14213d;
    --danger: #c1121f; --ok: #176b3a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1526; --grid: #1a2540; --sheet: #172036; --ink: #eaf0ff; --muted: #97a6c6;
      --accent: #7f9cff; --accent-text: #0e1526; --line: #2a3756; --mark: #7a6500; --mark-text: #fff6c2;
      --danger: #ff8b94; --ok: #7bdca3;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; color: var(--ink); line-height: 1.5;
    font-family: "Avenir Next", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    background-color: var(--bg);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 28px 28px;
  }
  main { max-width: 540px; margin: 0 auto; padding: 32px 16px 48px; }
  header { margin-bottom: 20px; }
  h1 { font-size: 2.1rem; line-height: 1.1; margin: 0 0 6px; letter-spacing: -0.02em; font-weight: 800; }
  .sub { color: var(--muted); margin: 0; }
  .sheet {
    background: var(--sheet); border: 2px solid var(--ink); border-radius: 6px;
    padding: 22px 20px 22px 28px; box-shadow: 6px 6px 0 var(--ink);
    position: relative;
  }
  .sheet::before { /* margin rule */
    content: ""; position: absolute; top: 0; bottom: 0; left: 14px; width: 2px; background: var(--danger); opacity: .55;
  }
  h2 { margin: 0 0 4px; font-size: 1.25rem; }
  label { display: block; font-size: .9rem; font-weight: 600; margin: 14px 0 4px; }
  input[type=text], input[type=email], input[type=password] {
    width: 100%; padding: 12px; font: inherit; color: var(--ink); background: transparent;
    border: 0; border-bottom: 2px solid var(--ink); border-radius: 0;
  }
  input::placeholder { color: var(--muted); }
  input[type=text]:focus, input[type=email]:focus, input[type=password]:focus { outline: none; background: var(--line); }
  button {
    font: inherit; font-weight: 600; cursor: pointer; color: var(--ink); background: var(--sheet);
    border: 2px solid var(--ink); border-radius: 6px; padding: 10px 14px; min-height: 44px;
    transition: transform .08s, box-shadow .08s;
  }
  button:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--ink); }
  button:active { transform: translate(1px, 1px); box-shadow: none; }
  button.primary { background: var(--accent); color: var(--accent-text); width: 100%; margin-top: 18px; }
  button.link { border: none; background: none; color: var(--accent); padding: 8px 0; min-height: 0; text-decoration: underline; box-shadow: none; transform: none; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .msg { min-height: 1.4em; margin: 10px 0 0; font-size: .9rem; font-weight: 600; }
  .msg.err { color: var(--danger); } .msg.ok { color: var(--ok); }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 4px; }
  .count { color: var(--muted); font-size: .9rem; margin: 0 0 14px; }
  .add { display: flex; gap: 8px; align-items: flex-end; }
  .add input { flex: 1; }
  ul { list-style: none; padding: 0; margin: 14px 0 0; }
  li { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px dashed var(--line); }
  li span { flex: 1; word-break: break-word; }
  li.done span { background: var(--mark); color: var(--mark-text); padding: 0 4px; border-radius: 2px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  li input[type=checkbox] { width: 24px; height: 24px; accent-color: var(--accent); flex: none; }
  li button { padding: 6px 10px; min-height: 40px; font-size: .85rem; color: var(--danger); border-color: var(--danger); background: transparent; }
  li button:hover { box-shadow: 2px 2px 0 var(--danger); }
  .empty { color: var(--muted); display: block; text-align: center; padding: 18px 0 4px; border-top: 1px dashed var(--line); }
  .hidden { display: none; }
  .ver { text-align: center; color: var(--muted); font-size: .8rem; margin-top: 26px; }
  @media (max-width: 480px) {
    h1 { font-size: 1.7rem; }
    .sheet { box-shadow: 4px 4px 0 var(--ink); }
  }
  @media (prefers-reduced-motion: reduce) { button { transition: none; } }
  @media (max-width: 480px) {
  button.primary { width: 100%; min-height: 48px; font-size: 1rem; }
}
</style>
</head>
<body>
<main>
  <header>
    <h1>Student Task Manager</h1>
    <p class="sub">Keep track of assignments and deadlines.</p>
  </header>

  <!-- Auth view -->
  <section id="authView" class="sheet">
    <h2 id="authTitle">Log in</h2>
    <div id="nameRow" class="hidden">
      <label for="name">Name</label>
      <input type="text" id="name" autocomplete="name">
    </div>
    <label for="email">Email</label>
    <input type="email" id="email" autocomplete="email">
    <label for="password">Password (min 6 characters)</label>
    <input type="password" id="password" autocomplete="current-password">
    <button id="authBtn" class="primary" type="button">Log in</button>
    <p id="authMsg" class="msg" role="alert"></p>
    <button id="toggleBtn" class="link" type="button">New here? Create an account</button>
  </section>

  <!-- Task view -->
  <section id="taskView" class="sheet hidden">
    <div class="bar">
      <h2 id="welcome"></h2>
      <button id="logoutBtn" type="button">Log out</button>
    </div>
    <p id="count" class="count"></p>
    <div class="add">
      <input type="text" id="taskTitle" placeholder="What needs doing?" aria-label="Task title" maxlength="120">
      <button id="addBtn" type="button">Add task</button>
    </div>
    <p id="taskMsg" class="msg err" role="alert"></p>
    <ul id="taskList"></ul>
  </section>

  <p class="ver">Version 1.0.0</p>
</main>

<script>
(function () {
  var USERS_KEY = "stm_users", SESSION_KEY = "stm_session", TASKS_KEY = "stm_tasks_";
  var isSignup = false;
  var $ = function (id) { return document.getElementById(id); };

  function read(key, fallback) {
    try { var v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
    catch (e) { return fallback; }
  }
  function write(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
  }
  // Simple hash so passwords are not stored as plain text (demo only, not real security)
  function hash(s) {
    var h = 0;
    for (var i = 0; i < s.length; i++) { h = ((h << 5) - h + s.charCodeAt(i)) | 0; }
    return String(h);
  }

  function setAuthMode(signup) {
    isSignup = signup;
    $("authTitle").textContent = signup ? "Create account" : "Log in";
    $("authBtn").textContent = signup ? "Sign up" : "Log in";
    $("toggleBtn").textContent = signup ? "Already registered? Log in" : "New here? Create an account";
    $("nameRow").classList.toggle("hidden", !signup);
    $("authMsg").textContent = "";
  }

  function authMessage(text, type) {
    var m = $("authMsg");
    m.textContent = text;
    m.className = "msg " + (type || "err");
  }

  function handleAuth() {
    var email = $("email").value.trim().toLowerCase();
    var pass = $("password").value;
    var users = read(USERS_KEY, {});
    if (!/^\S+@\S+\.\S+$/.test(email)) return authMessage("Enter a valid email address.");
    if (pass.length < 6) return authMessage("Password must be at least 6 characters.");

    if (isSignup) {
      var name = $("name").value.trim();
      if (!name) return authMessage("Enter your name.");
      if (users[email]) return authMessage("This email is already registered. Log in instead.");
      users[email] = { name: name, pass: hash(pass) };
      write(USERS_KEY, users);
      write(SESSION_KEY, email);
      showTasks();
    } else {
      if (!users[email] || users[email].pass !== hash(pass)) {
        return authMessage("Incorrect email or password.");
      }
      write(SESSION_KEY, email);
      showTasks();
    }
  }

  function currentEmail() { return read(SESSION_KEY, null); }
  function getTasks() { return read(TASKS_KEY + currentEmail(), []); }
  function saveTasks(t) { write(TASKS_KEY + currentEmail(), t); }

  function showTasks() {
    var email = currentEmail();
    var users = read(USERS_KEY, {});
    if (!email || !users[email]) return showAuth();
    $("authView").classList.add("hidden");
    $("taskView").classList.remove("hidden");
    $("welcome").textContent = "Hi, " + users[email].name;
    $("password").value = "";
    render();
  }

  function showAuth() {
    $("taskView").classList.add("hidden");
    $("authView").classList.remove("hidden");
    setAuthMode(false);
  }

  function render() {
    var list = $("taskList");
    var tasks = getTasks();
    var doneCount = tasks.filter(function (t) { return t.done; }).length;
    $("count").textContent = tasks.length ? doneCount + " of " + tasks.length + " done" : "";
    list.innerHTML = "";
    if (!tasks.length) {
      var p = document.createElement("li");
      p.className = "empty";
      p.textContent = "No tasks yet. Add your first one above.";
      list.appendChild(p);
      return;
    }
    tasks.forEach(function (t) {
      var li = document.createElement("li");
      if (t.done) li.className = "done";

      var cb = document.createElement("input");
      cb.type = "checkbox"; cb.checked = t.done;
      cb.setAttribute("aria-label", "Mark complete: " + t.title);
      cb.addEventListener("change", function () { toggleTask(t.id); });

      var span = document.createElement("span");
      span.textContent = t.title;  // textContent prevents HTML injection

      var del = document.createElement("button");
      del.type = "button"; del.textContent = "Delete";
      del.setAttribute("aria-label", "Delete task: " + t.title);
      del.addEventListener("click", function () { deleteTask(t.id); });

      li.appendChild(cb); li.appendChild(span); li.appendChild(del);
      list.appendChild(li);
    });
  }

  function addTask() {
    var input = $("taskTitle");
    var title = input.value.trim();
    if (!title) { $("taskMsg").textContent = "Task title cannot be empty."; return; }
    $("taskMsg").textContent = "";
    var tasks = getTasks();
    tasks.push({ id: Date.now() + "-" + Math.random().toString(36).slice(2, 6), title: title, done: false });
    saveTasks(tasks);
    input.value = "";
    render();
  }

  function toggleTask(id) {
    var tasks = getTasks().map(function (t) { if (t.id === id) t.done = !t.done; return t; });
    saveTasks(tasks); render();
  }

  function deleteTask(id) {
    saveTasks(getTasks().filter(function (t) { return t.id !== id; }));
    render();
  }

  $("authBtn").addEventListener("click", handleAuth);
  $("toggleBtn").addEventListener("click", function () { setAuthMode(!isSignup); });
  $("logoutBtn").addEventListener("click", function () {
    try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
    $("email").value = ""; showAuth();
  });
  $("addBtn").addEventListener("click", addTask);
  $("taskTitle").addEventListener("keydown", function (e) { if (e.key === "Enter") addTask(); });
  $("password").addEventListener("keydown", function (e) { if (e.key === "Enter") handleAuth(); });

  if (currentEmail()) showTasks(); else showAuth();
})();
</script>
</body>
</html>
